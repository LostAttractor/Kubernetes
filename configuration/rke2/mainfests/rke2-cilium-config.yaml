apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-cilium
  namespace: kube-system
spec:
  valuesContent: |-
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
    nodeIPAM:
      enabled: true
    mtu: 1500
    routingMode: tunnel
    underlayProtocol: ipv6
    encryption:
      enabled: true
      type: wireguard
    kubeProxyReplacement: true
    k8sServiceHost: node0-rke.home.lostattractor.net
    k8sServicePort: 6443
    cni:
      chainingMode: none
    bpf:
      datapathMode: netkit
      distributedLRU:
        enabled: true
      mapDynamicSizeRatio: 0.08
    bpfClockProbe: true
    bandwidthManager:
      enabled: true
      bbr: true
    loadBalancer:
      algorithm: maglev
      # acceleration: best-effort  # XDP acceleration cannot be used with an IPv6 underlay